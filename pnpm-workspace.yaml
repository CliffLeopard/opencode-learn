# This file exists to make this directory its own pnpm workspace root.
#
# The site ships no published package, is excluded from every surrounding
# repository gate, and pins React 19 / Next 16 independently of any parent
# dependency graph. Without this file, pnpm would walk up, resolve a parent
# workspace if one exists, and rewrite that lockfile.
packages: []

minimumReleaseAgeExclude:
  - lucide-react@1.39.0
